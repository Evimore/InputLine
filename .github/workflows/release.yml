name: Release

# Publishes InputLine-Setup-vX.msi (Windows installer), a portable zip of
# inputline-host, inputline-vX-linux-x86_64.tar.gz, and the unsigned
# InputLine-vX-iOS.ipa.
#
# Two ways to release:
# - On GitHub: Actions → Release → Run workflow, and enter a version such as
#   0.2.0. The release (and its tag, v0.2.0) is made from the latest main.
# - With git: push a tag such as v0.2.0.
# A version with a suffix, such as 0.2.0-beta.1, becomes a pre-release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version, for example 0.2.0 (the tag becomes v0.2.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      app-version: ${{ steps.version.outputs.app_version }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a version like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. Pick a new version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "app_version=${version%%-*}" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -A x64 -DINPUTLINE_BUILD_TESTS=OFF "-DINPUTLINE_VERSION=${{ needs.check.outputs.version }}"
          cmake --build build --config Release -j
      - name: Package
        shell: pwsh
        run: |
          $dir = "inputline-$env:TAG-windows-x64"
          New-Item -ItemType Directory $dir | Out-Null
          Copy-Item build/host/Release/inputline-host.exe, build/host/Release/inputline-sim.exe $dir
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES.md, docs/host-setup-windows.md $dir
          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
      - name: Build the installer
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2 WixToolset.Firewall.wixext/5.0.2 WixToolset.UI.wixext/5.0.2
          wix build installer/windows/InputLine.wxs -arch x64 `
            -ext WixToolset.Util.wixext -ext WixToolset.Firewall.wixext -ext WixToolset.UI.wixext `
            -d Version=${{ needs.check.outputs.app-version }} -d BinDir=build/host/Release -d "RepoUrl=${{ github.server_url }}/${{ github.repository }}" -d "RootDir=${{ github.workspace }}" `
            -o "InputLine-Setup-$env:TAG.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            InputLine-Setup-${{ env.TAG }}.msi
            inputline-${{ env.TAG }}-windows-x64.zip

  linux:
    name: Linux
    needs: check
    # The oldest supported Ubuntu, so the program runs on older and newer
    # distributions alike; the C++ runtime is built in.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DINPUTLINE_BUILD_TESTS=OFF "-DINPUTLINE_VERSION=${{ needs.check.outputs.version }}" \
            "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
          cmake --build build -j
          ./build/host/inputline-host --version
      - name: Package
        run: |
          dir="inputline-$TAG-linux-x86_64"
          mkdir "$dir"
          cp build/host/inputline-host build/host/inputline-sim "$dir/"
          strip "$dir/inputline-host" "$dir/inputline-sim"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md docs/host-setup-linux.md "$dir/"
          tar -czf "$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: inputline-${{ env.TAG }}-linux-x86_64.tar.gz

  inputline-ios:
    name: InputLine (iOS)
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build
        working-directory: clients/inputline-ios
        run: >
          xcodegen generate &&
          set -o pipefail &&
          xcodebuild -project InputLine.xcodeproj -target InputLine
          -sdk iphoneos -configuration Release SYMROOT="$RUNNER_TEMP/out"
          MARKETING_VERSION=${{ needs.check.outputs.app-version }} CURRENT_PROJECT_VERSION=${{ github.run_number }}
          INPUTLINE_VERSION=${{ needs.check.outputs.version }}
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build | tail -n 60
      # Unsigned: a sideloading tool (Sideloadly, AltStore) signs it with your Apple ID.
      - name: Package unsigned .ipa
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/out/Release-iphoneos/InputLine.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/InputLine-$TAG-iOS.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: inputline-ios
          path: InputLine-${{ env.TAG }}-iOS.ipa

  publish:
    name: Publish
    needs: [check, windows, linux, inputline-ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A release drafted on GitHub's Releases page gets the files added;
      # otherwise the release, and its tag on this commit, are created here.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            prerelease=""
            case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "InputLine $TAG" --generate-notes $prerelease
          fi
