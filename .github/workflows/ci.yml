name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # SDL release-3.4.x with full support for the 2026 Steam Controller (Triton).
  SDL_COMMIT: ae9489adbaade98f44d74f90fc24a3a014ca2648

jobs:
  linux:
    name: Linux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc, ASan + UBSan
            cc: gcc
            cxx: g++
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all
          - name: clang, TSan
            cc: clang
            cxx: clang++
            flags: -fsanitize=thread
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          "-DCMAKE_CXX_FLAGS=${{ matrix.flags }}"
      - name: Build
        run: cmake --build build -j
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  fuzz:
    name: Fuzz (libFuzzer, 1 min per target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the libFuzzer runtime
        run: sudo apt-get install -y libclang-rt-18-dev
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++ -DINPUTLINE_FUZZ=ON -DINPUTLINE_BUILD_TESTS=OFF
          cmake --build build -j --target fuzz_link_protocol fuzz_link_server fuzz_usbip_server fuzz_update_check
      - name: Fuzz
        run: |
          mkdir -p crashes
          for target in fuzz_link_protocol fuzz_link_server fuzz_usbip_server fuzz_update_check; do
            echo "::group::$target"
            mkdir -p "corpus/$target"
            build/fuzz/$target "corpus/$target" -max_total_time=60 -artifact_prefix=crashes/$target- -print_final_stats=1
            echo "::endgroup::"
          done
      - name: Upload what crashed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: crashes/

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release -j
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      # Registers with Windows' own mDNS responder. An error means the call is
      # wrong; a runner without DNS-SD only gets a warning.
      - name: Discovery smoke test
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'host.log'
          $config = Join-Path $env:RUNNER_TEMP 'clients.conf'
          $host_process = Start-Process -FilePath build/host/Release/inputline-host.exe -PassThru -NoNewWindow `
            -ArgumentList @('run', '--no-attach', '--verbose', '--config', $config, '--log', $log)
          Start-Sleep -Seconds 6
          Stop-Process -Id $host_process.Id -Force
          Get-Content $log
          if (Select-String -Path $log -Pattern 'announcing this PC failed|could not describe' -Quiet) { exit 1 }
          if (-not (Select-String -Path $log -Pattern 'can now find this PC' -Quiet)) {
            Write-Host '::warning::DNS-SD registration was not confirmed on this runner'
          }
      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2 WixToolset.Firewall.wixext/5.0.2 WixToolset.UI.wixext/5.0.2
      # Two versions of the same build, to test upgrading from one to the other.
      - name: Build the installer
        run: |
          foreach ($build in @(@{ Version = "0.0.${{ github.run_number }}"; Out = 'InputLine-Setup-old.msi' },
                               @{ Version = "0.1.${{ github.run_number }}"; Out = 'InputLine-Setup.msi' })) {
            wix build installer/windows/InputLine.wxs -arch x64 `
              -ext WixToolset.Util.wixext -ext WixToolset.Firewall.wixext -ext WixToolset.UI.wixext `
              -d "Version=$($build.Version)" -d BinDir=build/host/Release `
              -d "RepoUrl=${{ github.server_url }}/${{ github.repository }}" -d "RootDir=${{ github.workspace }}" `
              -o $build.Out
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      # Install, check, upgrade over the top, uninstall: on a real Windows.
      - name: Test the installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Msi([string[]] $arguments) {
            $process = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            return $process.ExitCode
          }
          function Check([bool] $ok, [string] $what) {
            if (-not $ok) { Write-Host "::error::$what"; exit 1 }
            Write-Host "ok: $what"
          }
          $data = Join-Path $env:ProgramData 'InputLine'

          # Existing pairings, and a setup made by hand with 'inputline-host install'.
          Remove-Item -Recurse -Force $data -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force (Join-Path $data 'pairing') | Out-Null
          Set-Content (Join-Path $data 'pairing\inputline-host.conf') '# paired devices'
          Register-ScheduledTask -TaskName InputLine -Action (New-ScheduledTaskAction -Execute cmd.exe -Argument '/c exit') -Force | Out-Null

          # This runner has no usbip-win2: InputLine installs anyway and says it's missing.
          $code = Invoke-Msi @('/i', 'InputLine-Setup-old.msi', '/qn', '/l*v', 'msi-install.log')
          if ($code -ne 0) { Get-Content msi-install.log -Tail 80 }
          Check ($code -eq 0) "installs (exit $code)"
          Start-Sleep -Seconds 6
          $log = Join-Path $data 'inputline-host.log'
          Get-Content $log
          Check ((Get-Service InputLine).Status -eq 'Running') 'the InputLine service runs'
          Check ((Get-Service InputLine).StartType -eq 'Automatic') 'the service starts with Windows'
          Check (Select-String -Path $log -Pattern 'starting as a Windows service' -Quiet) 'the service logs to ProgramData'
          Check (Select-String -Path $log -Pattern 'listening on UDP port 48150' -Quiet) 'the service listens on the link port'
          Check ($null -ne (Get-NetFirewallRule -DisplayName 'InputLine (UDP 48150)' -ErrorAction SilentlyContinue)) 'the firewall rule exists'
          Check (Test-Path (Join-Path $data 'pairing\inputline-host.conf')) 'existing pairings are kept'
          Check ($null -eq (Get-ScheduledTask -TaskName InputLine -ErrorAction SilentlyContinue)) 'the setup made by hand is removed'
          $acl = (icacls (Join-Path $data 'pairing')) -join "`n"
          Write-Host $acl
          Check (-not ($acl -match 'BUILTIN\\Users')) 'users cannot read the pairing keys'
          $failure = (sc.exe qfailure InputLine) -join "`n"
          Check ($failure -match 'RESTART') 'the service restarts after a failure'
          Check (Test-Path "$env:ProgramFiles\InputLine\inputline-host.exe") 'inputline-host.exe is in Program Files'
          $status = Join-Path $data 'status.txt'
          Check ((Test-Path $status) -and (Select-String -Path $status -Pattern '^time=[0-9]+' -Quiet)) 'the service writes its status for the tray icon'
          Check (Select-String -Path $status -Pattern '^usbip=missing' -Quiet) 'the status says usbip-win2 is missing'
          Check (Select-String -Path $log -Pattern 'usbip-win2 is not installed' -Quiet) 'the log says usbip-win2 is missing'
          Check (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\InputLine.lnk") 'the Start menu has InputLine'

          $code = Invoke-Msi @('/fa', 'InputLine-Setup-old.msi', '/qn', '/l*v', 'msi-repair.log')
          Check ($code -eq 0) "repairs (exit $code)"
          Start-Sleep -Seconds 3
          Check ((Get-Service InputLine).Status -eq 'Running') 'the service runs after a repair'

          $code = Invoke-Msi @('/i', 'InputLine-Setup.msi', '/qn', '/l*v', 'msi-upgrade.log')
          Check ($code -eq 0) "upgrades to the newer version (exit $code)"
          Start-Sleep -Seconds 4
          Check ((Get-Service InputLine).Status -eq 'Running') 'the service runs after upgrading'
          $installed = @(Get-CimInstance Win32_Product -Filter "Name = 'InputLine'")
          Check ($installed.Count -eq 1 -and $installed[0].Version -like '0.1.*') "exactly one InputLine is installed, the newer one ($($installed.Version -join ', '))"
          Check (Test-Path (Join-Path $data 'pairing\inputline-host.conf')) 'pairings survive the upgrade'

          $code = Invoke-Msi @('/x', 'InputLine-Setup.msi', '/qn', '/l*v', 'msi-uninstall.log')
          Check ($code -eq 0) "uninstalls (exit $code)"
          Check ($null -eq (Get-Service InputLine -ErrorAction SilentlyContinue)) 'the service is gone'
          Check ($null -eq (Get-NetFirewallRule -DisplayName 'InputLine (UDP 48150)' -ErrorAction SilentlyContinue)) 'the firewall rule is gone'
          Check (-not (Test-Path "$env:ProgramFiles\InputLine\inputline-host.exe")) 'the program is gone'
          Check (-not (Test-Path (Join-Path $data 'status.txt'))) 'the stopped service leaves no status behind'
          Check (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\InputLine.lnk")) 'the Start menu entry is gone'
          Check (Test-Path (Join-Path $data 'pairing\inputline-host.conf')) 'pairings are kept for a later install'
      - name: Installer logs
        if: failure()
        shell: pwsh
        run: Get-ChildItem msi-*.log -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "==== $_"; Get-Content $_ -Tail 80 }
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: inputline-windows-x64
          path: |
            build/host/Release/inputline-host.exe
            build/host/Release/inputline-sim.exe
      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: InputLine-Setup.msi
          path: InputLine-Setup.msi

  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  inputline-ios:
    name: InputLine (iOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the Xcode project
        working-directory: clients/inputline-ios
        run: xcodegen generate
      - name: Build
        working-directory: clients/inputline-ios
        run: >
          set -o pipefail &&
          xcodebuild -project InputLine.xcodeproj -target InputLine
          -sdk iphoneos -configuration Release SYMROOT="$RUNNER_TEMP/out"
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          build | tail -n 80
      # Unsigned: a sideloading tool (Sideloadly, AltStore) signs it with your Apple ID.
      - name: Package unsigned .ipa
        run: |
          app="$RUNNER_TEMP/out/Release-iphoneos/InputLine.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/InputLine-iOS.ipa" Payload)
          ls -l InputLine-iOS.ipa
      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: InputLine-iOS.ipa
          path: InputLine-iOS.ipa
          if-no-files-found: error
      # Screenshots of the app's states (made up, no Bluetooth or PC), to
      # review the design without installing it.
      - name: Build for the simulator
        working-directory: clients/inputline-ios
        run: >
          set -o pipefail &&
          xcodebuild -project InputLine.xcodeproj -target InputLine
          -sdk iphonesimulator -arch arm64 -configuration Debug SYMROOT="$RUNNER_TEMP/sim"
          build | tail -n 20
      - name: Take screenshots
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/sim/Debug-iphonesimulator/InputLine.app"
          mkdir -p screenshots
          pick() {
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          prefix = sys.argv[1]
          devices = [d for runtime, ds in json.load(sys.stdin)["devices"].items() if "iOS" in runtime for d in ds if d["name"].startswith(prefix)]
          print(sorted(devices, key=lambda d: d["name"])[0]["udid"])' "$1"
          }
          for kind in "iPad Air" "iPhone"; do
            udid=$(pick "$kind")
            name=$(echo "$kind" | tr -d ' ')
            xcrun simctl boot "$udid"
            xcrun simctl bootstatus "$udid" -b > /dev/null
            xcrun simctl status_bar "$udid" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            xcrun simctl install "$udid" "$app"
            for appearance in light dark; do
              xcrun simctl ui "$udid" appearance "$appearance"
              for state in setup searching notfound connected disconnected; do
                xcrun simctl launch --terminate-running-process "$udid" com.evimore.InputLine -ILNScreenshot "$state" > /dev/null
                sleep 4
                xcrun simctl io "$udid" screenshot "screenshots/$name-$appearance-$state.png" > /dev/null
              done
            done
            xcrun simctl shutdown "$udid"
          done
          ls screenshots
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: InputLine-screenshots
          path: screenshots
          if-no-files-found: error

  linux-service:
    name: Linux service (install, pair, attach, uninstall)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install usbip, Avahi and ufw
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" "linux-tools-$(uname -r)" linux-tools-common \
            avahi-daemon avahi-utils libnotify-bin ufw usbutils libglib2.0-bin dbus
          sudo systemctl start avahi-daemon
          sudo ufw --force enable
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DINPUTLINE_BUILD_TESTS=OFF
          cmake --build build -j
      - name: Install as a service
        run: |
          sudo ./build/host/inputline-host install | tee "$RUNNER_TEMP/install.txt"
          systemctl is-active --quiet inputline
          systemctl is-enabled --quiet inputline
          test -x /usr/local/bin/inputline-host
          test -f /etc/inputline/options.txt
          grep -q vhci-hcd /etc/modules-load.d/inputline.conf
          grep -q 28de /etc/udev/rules.d/70-inputline.rules
          lsmod | grep -q vhci_hcd
          sudo ufw status | tee "$RUNNER_TEMP/ufw.txt"
          grep -q "48150/udp" "$RUNNER_TEMP/ufw.txt"
          # The service writes its status every 2 s.
          for i in $(seq 1 15); do inputline-host status && break; sleep 1; done
          inputline-host status | grep -q "usbip: ready"
      - name: Found on the network (Avahi)
        run: |
          for i in $(seq 1 15); do
            avahi-browse --resolve --parsable --terminate _inputline._udp | tee "$RUNNER_TEMP/avahi.txt"
            grep -q ";48150;" "$RUNNER_TEMP/avahi.txt" && exit 0
            sleep 1
          done
          exit 1
      - name: Pair through the service, like the app
        run: |
          mkfifo "$RUNNER_TEMP/pin"
          ./build/host/inputline-sim --state "$RUNNER_TEMP/sim.pairing" pair < "$RUNNER_TEMP/pin" > "$RUNNER_TEMP/pair.txt" 2>&1 &
          exec 3> "$RUNNER_TEMP/pin"
          # The code pops up as a notification and goes to the journal.
          code=""
          for i in $(seq 1 15); do
            code=$(sudo journalctl -u inputline --no-pager | grep -o "pairing code for 'inputline-sim': [0-9]*" | tail -n 1 | grep -o "[0-9]*$" || true)
            [ -n "$code" ] && break
            sleep 1
          done
          test -n "$code"
          echo "$code" >&3
          exec 3>&-
          wait
          cat "$RUNNER_TEMP/pair.txt"
          sudo inputline-host clients | grep -q inputline-sim
      - name: Stream and attach
        run: |
          ./build/host/inputline-sim --state "$RUNNER_TEMP/sim.pairing" run 40 > "$RUNNER_TEMP/sim.log" 2>&1 &
          for i in $(seq 1 20); do inputline-host status | grep -q "(1 controller)" && break; sleep 1; done
          inputline-host status
          inputline-host status | grep -q "Connected: inputline-sim (1 controller)"
          for i in $(seq 1 10); do lsusb -d 28de:1302 && break; sleep 1; done
          lsusb -d 28de:1302
      - name: Tray icon (StatusNotifierItem over D-Bus)
        run: |
          test -f /etc/xdg/autostart/inputline-tray.desktop
          test -f /usr/local/share/applications/inputline.desktop
          file /usr/local/share/icons/hicolor/64x64/apps/inputline.png | grep -q "PNG image data, 64 x 64"
          cat > "$RUNNER_TEMP/tray.sh" <<'SCRIPT'
          set -e
          HOME="$RUNNER_TEMP/home" inputline-host tray &
          sleep 2
          call() { gdbus call --session --dest io.github.evimore.InputLine.Tray "$@"; }
          call --object-path /StatusNotifierItem --method org.freedesktop.DBus.Properties.Get org.kde.StatusNotifierItem ToolTip | tee "$RUNNER_TEMP/tooltip.txt"
          grep -q "Connected: inputline-sim (1 controller)" "$RUNNER_TEMP/tooltip.txt"
          call --object-path /StatusNotifierItem --method org.freedesktop.DBus.Properties.Get org.kde.StatusNotifierItem IconPixmap | grep -q "(64, 64,"
          call --object-path /MenuBar --method com.canonical.dbusmenu.GetLayout 0 "int32 -1" "[]" | tee "$RUNNER_TEMP/menu.txt"
          grep -q "Show the log" "$RUNNER_TEMP/menu.txt"
          # A second icon in the same session steps aside.
          HOME="$RUNNER_TEMP/home" inputline-host tray
          kill %1
          SCRIPT
          mkdir -p "$RUNNER_TEMP/home"
          RUNNER_TEMP="$RUNNER_TEMP" dbus-run-session -- bash "$RUNNER_TEMP/tray.sh"
      - name: Uninstall
        run: |
          sudo inputline-host uninstall
          ! systemctl is-active --quiet inputline
          test ! -e /etc/systemd/system/inputline.service
          test ! -e /usr/local/bin/inputline-host
          test ! -e /etc/udev/rules.d/70-inputline.rules
          test ! -e /etc/xdg/autostart/inputline-tray.desktop
          test ! -e /usr/local/share/applications/inputline.desktop
          ! sudo ufw status | grep -q "48150/udp"
          sudo test -f /var/lib/inputline/pairing/inputline-host.conf
      - name: Logs
        if: always()
        run: |
          echo "--- install"; cat "$RUNNER_TEMP/install.txt" || true
          echo "--- journal"; sudo journalctl -u inputline --no-pager | tail -n 80 || true
          echo "--- sim"; cat "$RUNNER_TEMP/sim.log" || true
          echo "--- usbip port"; sudo usbip port || true

  usbip-end-to-end:
    name: End to end (Linux vhci-hcd + SDL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install USB/IP kernel support and libusb
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" "linux-tools-$(uname -r)" linux-tools-common libusb-1.0-0-dev
          sudo modprobe vhci-hcd
          # Not every cloud kernel ships usbhid; the checks below use libusb when it is missing.
          sudo modprobe usbhid 2>/dev/null || echo "usbhid unavailable on this kernel"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyusb
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DINPUTLINE_BUILD_TESTS=OFF
          cmake --build build -j
      - name: Build SDL (with libusb HIDAPI) and the probe
        run: |
          git clone --filter=blob:none https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          git -C "$RUNNER_TEMP/SDL" checkout "$SDL_COMMIT"
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL/build" -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF -DSDL_STATIC=ON -DSDL_TEST_LIBRARY=OFF -DSDL_UNIX_CONSOLE_BUILD=ON \
            -DSDL_HIDAPI_LIBUSB=ON -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/sdl"
          cmake --build "$RUNNER_TEMP/SDL/build" -j
          cmake --install "$RUNNER_TEMP/SDL/build"
          cc -O2 -I"$RUNNER_TEMP/sdl/include" tests/integration/sdl_probe.c \
            "$RUNNER_TEMP/sdl/lib/libSDL3.a" -lm -lpthread -ldl -o "$RUNNER_TEMP/sdl_probe"
      - name: Pair, stream and attach
        run: |
          sudo ./build/host/inputline-host --verbose --config "$RUNNER_TEMP/host.conf" --pin 424242 pair > "$RUNNER_TEMP/host.log" 2>&1 &
          sleep 1
          ./build/host/inputline-sim --state "$RUNNER_TEMP/sim.pairing" --pin 424242 pair
          ./build/host/inputline-sim --state "$RUNNER_TEMP/sim.pairing" run 120 > "$RUNNER_TEMP/sim.log" 2>&1 &
          sleep 3
      - name: Check at the USB level (libusb)
        run: sudo "$RUNNER_TEMP/venv/bin/python" tests/integration/check_usb.py
      - name: Check haptics and settings reached the client, and nothing unsafe did
        run: |
          sleep 1
          cat "$RUNNER_TEMP/sim.log"
          grep -q "host sent output report 0x81" "$RUNNER_TEMP/sim.log"
          grep -q "host sent setting 0x87" "$RUNNER_TEMP/sim.log"
          ! grep -q "host sent setting 0x86" "$RUNNER_TEMP/sim.log"
      - name: Check through hidraw
        run: |
          if lsmod | grep -q "^usbhid"; then
            sudo python3 tests/integration/check_hidraw.py
          else
            echo "usbhid not available on this kernel; covered by the libusb check"
          fi
      - name: Check through SDL's Steam Controller driver
        env:
          SDL_HIDAPI_LIBUSB_WHITELIST: "0"
        run: sudo --preserve-env=SDL_HIDAPI_LIBUSB_WHITELIST "$RUNNER_TEMP/sdl_probe"
      - name: Logs
        if: always()
        run: |
          echo "--- inputline-host"; cat "$RUNNER_TEMP/host.log" || true
          echo "--- inputline-sim"; cat "$RUNNER_TEMP/sim.log" || true
          echo "--- usbip port"; sudo usbip port || true
          echo "--- dmesg"; sudo dmesg | grep -iE "usb|hid|vhci" | tail -n 40 || true
          echo "--- usb interfaces"; for d in /sys/bus/usb/devices/*-*:*; do echo "$d: $(cat $d/modalias 2>/dev/null)"; done || true
